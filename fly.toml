# fly.toml app configuration file generated for gastto on 2026-05-17T18:13:20+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'gastto'
primary_region = 'cdg'
kill_signal = 'SIGTERM'
# Initial BullMQ drain window; revisit if observed job duration requires more time.
kill_timeout = '30s'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  # BullMQ workers require a continuously running Machine (ADR-009, ADR-010).
  auto_stop_machines = 'off'
  auto_start_machines = false
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
