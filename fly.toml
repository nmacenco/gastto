# fly.toml app configuration file generated for gastto on 2026-05-17T18:13:20+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'gastto'
primary_region = 'cdg'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  # NOTE: auto_stop_machines must be set to false when BullMQ workers are introduced (per ADR-009).
  auto_stop_machines = true
  auto_start_machines = false
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
