name: CI

on:
  # Keep required checks independent from deployment branch filters.
  schedule:
    - cron: '20 6 * * 1'
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Security audit tests
        run: pnpm security:test

      - name: Production dependency gate
        run: pnpm security:audit

      - name: All dependency gate
        run: pnpm security:audit:all

      - name: Audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-audit
          path: |
            security-audit.json
            security-audit-all.json
          retention-days: 14

      - name: Integration prerequisites
        run: docker info

      - name: Test
        env:
          RUN_POSTGRES_INTEGRATION: 'true'
          DOTENV_CONFIG_PATH: /dev/null
        run: pnpm test --maxWorkers=4

  deploy:
    name: Deploy app
    needs: quality
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200

        with:
          version: v0.5.1

      - name: Deploy to production
        if: github.ref == 'refs/heads/main'
        run: flyctl deploy --config fly.toml --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy to development
        if: github.ref == 'refs/heads/develop'
        run: flyctl deploy --config fly.develop.toml --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_DEVELOP }}
