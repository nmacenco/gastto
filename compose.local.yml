name: gastto-local

x-app-image: &app-image
  build:
    context: .
    dockerfile: Dockerfile.dev
  image: gastto-local-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gastto
      POSTGRES_USER: gastto
      POSTGRES_PASSWORD: ${GASTTO_LOCAL_DB_PASSWORD:?Set GASTTO_LOCAL_DB_PASSWORD in the ignored .env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gastto -d gastto"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    <<: *app-image
    command: ["pnpm", "db:migrate"]
    environment:
      DATABASE_URL: postgresql://gastto:${GASTTO_LOCAL_DB_PASSWORD:?Set GASTTO_LOCAL_DB_PASSWORD in the ignored .env file}@postgres:5432/gastto
    depends_on:
      postgres:
        condition: service_healthy

  app:
    <<: *app-image
    command: ["pnpm", "dev"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://gastto:${GASTTO_LOCAL_DB_PASSWORD:?Set GASTTO_LOCAL_DB_PASSWORD in the ignored .env file}@postgres:5432/gastto
      REDIS_URL: redis://redis:6379
      PORT: 3000
    volumes:
      - ./src:/app/src
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data:
